# SonarQube configuration for HN-Designsystem
# Used by the SonarQubePrepare task (configMode: file) in Pipelines/hn-designsystem.designsystem-react-pipeline.yml

sonar.projectKey=Designsystem.Packages.Designsystem.CI
sonar.projectName=Designsystem.Packages.Designsystem.CI

sonar.sources=npm/
sonar.tests=npm/
sonar.test.inclusions=npm/**/*.test.tsx
sonar.exclusions=**/*.test.tsx,**/*.stories.tsx
sonar.coverage.exclusions=**/__*__/**/*,**/*.config.js,**/*.config.ts,**/*.stories.tsx,**/Icons/*.tsx,**/Illustrations/*.tsx,**/Icons/*.ts,**/Illustrations/*.ts,**/components/*/index.ts,**/components/*/*/index.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig-sonarqube.json

# Issue suppressions
sonar.issue.ignore.multicriteria=scssImportAfterUse,unsafePascalCase,unsafeDatePickerPascalCase

# @use must come before other rules in SCSS, but we allow @import after @use
sonar.issue.ignore.multicriteria.scssImportAfterUse.ruleKey=css:S8778
sonar.issue.ignore.multicriteria.scssImportAfterUse.resourceKey=**/*.scss

# These components intentionally keep their UNSAFE_/Unsafe_ prefix to signal risky APIs
sonar.issue.ignore.multicriteria.unsafePascalCase.ruleKey=typescript:S6770
sonar.issue.ignore.multicriteria.unsafePascalCase.resourceKey=**/components/UNSAFE_Table/**/*.tsx
sonar.issue.ignore.multicriteria.unsafeDatePickerPascalCase.ruleKey=typescript:S6770
sonar.issue.ignore.multicriteria.unsafeDatePickerPascalCase.resourceKey=**/components/Unsafe_DatePicker/**/*.tsx
